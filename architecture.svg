<svg viewBox="0 0 1500 640" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1500" height="640" fill="#f8fafc"/>
  <text x="750" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Dengue Ward-Risk Prototype — Architecture</text>

  <!-- Row 1: offline training pipeline -->
  <text x="40" y="78" font-size="13" font-weight="700" fill="#64748b">OFFLINE — run once per dataset update, requires data/dengue_dataset.csv</text>

  <!-- Data -->
  <rect x="40" y="95" width="210" height="100" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="145" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">data/dengue_dataset.csv</text>
  <text x="145" y="144" text-anchor="middle" font-size="11" fill="#334155">60 wards x 522 weeks</text>
  <text x="145" y="160" text-anchor="middle" font-size="11" fill="#334155">2016-01-04 .. 2025-12-29</text>
  <text x="145" y="176" text-anchor="middle" font-size="11" fill="#334155">gitignored, local only</text>

  <path d="M250,145 L298,145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ml/features.py -->
  <rect x="300" y="95" width="230" height="100" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="415" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ml/features.py</text>
  <text x="415" y="144" text-anchor="middle" font-size="11" fill="#1e40af">lag1-4: rainfall, temp, humidity</text>
  <text x="415" y="160" text-anchor="middle" font-size="11" fill="#1e40af">lead2/3/4: dengue_cases</text>
  <text x="415" y="176" text-anchor="middle" font-size="11" fill="#1e40af">per ward_id, no lag0</text>

  <path d="M530,145 L578,145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ml/train.py -->
  <rect x="580" y="95" width="250" height="100" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="705" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ml/train.py</text>
  <text x="705" y="138" text-anchor="middle" font-size="11" fill="#1e40af">chronological split</text>
  <text x="705" y="153" text-anchor="middle" font-size="11" fill="#1e40af">train &lt;=2023 / val 2024 / test 2025</text>
  <text x="705" y="172" text-anchor="middle" font-size="11" fill="#1e40af">3x LGBMRegressor(objective="poisson")</text>

  <path d="M830,145 L878,145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- artifacts -->
  <rect x="880" y="95" width="320" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1040" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">ml/artifacts/ (committed to git)</text>
  <text x="1040" y="136" text-anchor="middle" font-size="10.5" fill="#92400e">model_h2/h3/h4.joblib · thresholds.json</text>
  <text x="1040" y="152" text-anchor="middle" font-size="10.5" fill="#92400e">feature_columns.json · ward_snapshot.json</text>
  <text x="1040" y="168" text-anchor="middle" font-size="10.5" fill="#92400e">metrics.json · intervals.json</text>
  <text x="1040" y="184" text-anchor="middle" font-size="9.5" fill="#b45309">(small files — no dataset needed to run the app)</text>

  <!-- Row 2: runtime -->
  <text x="40" y="235" font-size="13" font-weight="700" fill="#64748b">RUNTIME — fresh clone, no dataset needed, loads only ml/artifacts/</text>

  <!-- Backend -->
  <rect x="40" y="252" width="420" height="150" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="250" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">backend/app (FastAPI)</text>
  <text x="60" y="298" font-size="11" fill="#166534">load_artifacts() once at startup --&gt; in-memory Artifacts</text>
  <text x="60" y="318" font-size="11.5" font-weight="700" fill="#14532d">GET /wards</text>
  <text x="60" y="334" font-size="10.5" fill="#166534">list[WardInfo] from ward_snapshot.json</text>
  <text x="60" y="354" font-size="11.5" font-weight="700" fill="#14532d">GET /predict?ward_id=&amp;horizon_weeks=</text>
  <text x="60" y="370" font-size="10.5" fill="#166534">model.predict() + pred_contrib (per-ward drivers)</text>
  <text x="60" y="386" font-size="10.5" fill="#166534">risk tier + confidence interval, live every request</text>

  <rect x="240" y="406" width="100" height="26" rx="6" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="290" y="423" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">GET /metrics</text>

  <!-- connecting arrow artifacts -> backend -->
  <path d="M1040,195 L1040,215 L260,215 L260,250" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- HTTP connector -->
  <path d="M460,330 L600,330" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="530" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">HTTP / JSON</text>
  <text x="530" y="348" text-anchor="middle" font-size="9.5" fill="#64748b">fetch(VITE_API_BASE_URL)</text>
  <text x="530" y="362" text-anchor="middle" font-size="9.5" fill="#64748b">localhost:8000</text>

  <!-- Frontend -->
  <rect x="600" y="252" width="420" height="150" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="810" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">frontend/ (React + Vite + TS)</text>
  <text x="620" y="298" font-size="11" fill="#5b21b6">lib/api.ts --&gt; getWards(), getPrediction()</text>
  <text x="620" y="318" font-size="11" fill="#5b21b6">hooks/useWards.ts, usePrediction.ts</text>
  <text x="620" y="342" font-size="11" font-weight="700" fill="#4c1d95">pages/Dashboard.tsx</text>
  <text x="630" y="360" font-size="10.5" fill="#5b21b6">WardSelector, HorizonSelector</text>
  <text x="630" y="376" font-size="10.5" fill="#5b21b6">RiskPlate, DriverBoard, ValidationRows</text>
  <text x="630" y="392" font-size="9.5" fill="#7c3aed">(?ward=..&amp;horizon=.. kept in the URL)</text>

  <!-- Browser -->
  <path d="M1020,330 L1060,330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="290" width="160" height="80" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1140" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Browser</text>
  <text x="1140" y="342" text-anchor="middle" font-size="10.5" fill="#334155">ward + horizon picker,</text>
  <text x="1140" y="358" text-anchor="middle" font-size="10.5" fill="#334155">risk tier, drivers, metrics</text>

  <!-- footer notes -->
  <rect x="40" y="440" width="1420" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="466" font-size="13" font-weight="700" fill="#0f172a">Why it's split this way</text>
  <text x="60" y="490" font-size="11" fill="#334155">- Training is offline and needs the full CSV; serving never touches the CSV, only the small committed ml/artifacts/ files -&gt; a fresh clone</text>
  <text x="76" y="506" font-size="11" fill="#334155">launches and serves real predictions in under 3 minutes with zero dataset download.</text>
  <text x="60" y="528" font-size="11" fill="#334155">- Direct multi-horizon, not recursive: model_h2/h3/h4 each map the same 15-feature input straight to their own target (2/3/4 weeks</text>
  <text x="76" y="544" font-size="11" fill="#334155">out) — a bad short-horizon guess never corrupts a longer one, unlike feeding predictions back in as fake observations.</text>
  <text x="60" y="566" font-size="11" fill="#334155">- Drivers come from pred_contrib (per-prediction, Poisson log-space), not feature_importances_ (one fixed array for the whole</text>
  <text x="76" y="582" font-size="11" fill="#334155">model) — so two different wards correctly show two different "why" breakdowns instead of an identical static list.</text>
</svg>
